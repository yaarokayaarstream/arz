<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desktop Note — Firebase Realtime Stream</title>
  <!-- Google Fonts for crisp modern typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Firebase JS SDK (Compat version for zero-build standalone portability) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg-canvas: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.85);
      --card-border: rgba(255, 255, 255, 0.1);
      --accent: #f59e0b;
      --accent-glow: rgba(245, 158, 11, 0.25);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --note-yellow: #fef08a;
      --note-yellow-border: #fde047;
      --note-yellow-text: #713f12;
      --note-blue: #bae6fd;
      --note-blue-border: #7dd3fc;
      --note-blue-text: #075985;
      --note-pink: #fbcfe8;
      --note-pink-border: #f472b6;
      --note-pink-text: #831843;
      --note-green: #bbf7d0;
      --note-green-border: #86efac;
      --note-green-text: #14532d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #0f172a 60%, #020617 100%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 18px 14px 30px;
      overflow-x: hidden;
    }

    /* Floating Desktop Note Window Container */
    .desktop-widget {
      width: 100%;
      max-width: 620px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7), 0 0 40px -10px var(--accent-glow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Window Header / Titlebar */
    .titlebar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      background: rgba(30, 41, 59, 0.7);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      cursor: grab;
    }

    .titlebar-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .window-controls {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      cursor: pointer;
      transition: transform 0.15s ease;
    }
    .dot:hover { transform: scale(1.15); }
    .dot-red { background: #ef4444; }
    .dot-yellow { background: #f59e0b; }
    .dot-green { background: #10b981; }

    .widget-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: 6px;
    }

    .widget-brand svg {
      color: #f59e0b;
      filter: drop-shadow(0 0 8px rgba(245, 158, 11, 0.5));
    }

    .widget-title {
      font-size: 13.5px;
      font-weight: 700;
      letter-spacing: -0.2px;
      color: #f8fafc;
    }

    .titlebar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-sub);
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
    }
    .icon-btn.active {
      background: rgba(245, 158, 11, 0.2);
      border-color: rgba(245, 158, 11, 0.4);
      color: #f59e0b;
    }

    /* Live Status Bar */
    .status-ribbon {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 18px;
      background: rgba(15, 23, 42, 0.6);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 11.5px;
    }

    .status-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-pulse {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 10px #10b981;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.2); }
      100% { opacity: 1; transform: scale(1); }
    }

    .status-pulse.offline {
      background: #ef4444;
      box-shadow: 0 0 10px #ef4444;
      animation: none;
    }

    .status-text {
      font-weight: 600;
      color: #cbd5e1;
    }

    .database-path-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.3);
      color: #fbbf24;
      padding: 2px 7px;
      border-radius: 6px;
      letter-spacing: 0.2px;
    }

    .status-counts {
      color: var(--text-sub);
      font-weight: 500;
    }

    /* Action bar & Search */
    .control-deck {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 18px;
      background: rgba(255, 255, 255, 0.02);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .search-input-wrap {
      flex: 1;
      position: relative;
    }

    .search-input {
      width: 100%;
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 7px 12px 7px 30px;
      color: #fff;
      font-size: 12px;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-input:focus {
      border-color: #f59e0b;
      background: rgba(30, 41, 59, 0.9);
    }

    .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-sub);
      width: 13px;
      height: 13px;
    }

    .action-btn {
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.3);
      color: #f59e0b;
      font-size: 11.5px;
      font-weight: 700;
      padding: 7px 12px;
      border-radius: 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .action-btn:hover {
      background: #f59e0b;
      color: #0f172a;
      box-shadow: 0 0 15px rgba(245, 158, 11, 0.4);
    }

    /* Screen Messages Feed */
    .notes-board {
      flex: 1;
      min-height: 280px;
      max-height: 480px;
      overflow-y: auto;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }

    .notes-board::-webkit-scrollbar {
      width: 5px;
    }
    .notes-board::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
    }

    /* Sticky Note Card Design */
    .note-card {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-left: 4px solid #f59e0b;
      border-radius: 12px;
      padding: 12px 14px;
      position: relative;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      animation: noteSlideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      user-select: text;
    }

    @keyframes noteSlideIn {
      from {
        opacity: 0;
        transform: translateY(-12px) scale(0.97);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .note-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      border-color: rgba(255, 255, 255, 0.2);
    }

    /* Color styles */
    .note-card.theme-yellow {
      background: rgba(254, 240, 138, 0.95);
      border: 1px solid #fde047;
      border-left: 5px solid #ca8a04;
      color: #713f12;
    }
    .note-card.theme-yellow .note-meta,
    .note-card.theme-yellow .note-author {
      color: #854d0e;
    }

    .note-card.theme-blue {
      background: rgba(224, 242, 254, 0.95);
      border: 1px solid #7dd3fc;
      border-left: 5px solid #0284c7;
      color: #075985;
    }
    .note-card.theme-blue .note-meta,
    .note-card.theme-blue .note-author {
      color: #0369a1;
    }

    .note-card.theme-pink {
      background: rgba(252, 231, 243, 0.95);
      border: 1px solid #f472b6;
      border-left: 5px solid #db2777;
      color: #831843;
    }
    .note-card.theme-pink .note-meta,
    .note-card.theme-pink .note-author {
      color: #9d174d;
    }

    .note-card.theme-green {
      background: rgba(220, 252, 231, 0.95);
      border: 1px solid #86efac;
      border-left: 5px solid #16a34a;
      color: #14532d;
    }
    .note-card.theme-green .note-meta,
    .note-card.theme-green .note-author {
      color: #15803d;
    }

    .note-card.theme-dark {
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-left: 5px solid #6366f1;
      color: #f8fafc;
    }

    .note-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .note-author-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .author-avatar {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 800;
    }

    .note-author {
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: -0.2px;
    }

    .note-badge {
      font-size: 9px;
      font-weight: 800;
      text-transform: uppercase;
      padding: 1.5px 5px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.1);
      letter-spacing: 0.5px;
    }

    .note-meta {
      font-size: 10.5px;
      opacity: 0.8;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .note-card-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      opacity: 0.6;
      transition: opacity 0.2s;
    }
    .note-card:hover .note-card-actions {
      opacity: 1;
    }

    .card-tool-btn {
      background: transparent;
      border: none;
      color: inherit;
      cursor: pointer;
      padding: 3px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }
    .card-tool-btn:hover {
      background: rgba(0, 0, 0, 0.1);
    }

    .note-body {
      font-size: 13px;
      line-height: 1.5;
      font-weight: 500;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* Empty state */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      text-align: center;
      color: var(--text-sub);
    }

    .empty-icon {
      width: 48px;
      height: 48px;
      margin-bottom: 12px;
      opacity: 0.4;
      color: #f59e0b;
    }

    .empty-state h3 {
      font-size: 14px;
      color: #e2e8f0;
      margin-bottom: 4px;
    }

    .empty-state p {
      font-size: 12px;
      max-width: 320px;
      line-height: 1.4;
    }

    /* Composer / Post New Note */
    .composer {
      background: rgba(30, 41, 59, 0.9);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding: 14px 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .composer-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .composer-input {
      flex: 1;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 9px 12px;
      color: #fff;
      font-size: 12.5px;
      outline: none;
      transition: all 0.2s;
      font-family: inherit;
    }
    .composer-input:focus {
      border-color: #f59e0b;
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.2);
    }

    .author-input {
      width: 120px;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 9px 10px;
      color: #fff;
      font-size: 12px;
      outline: none;
    }

    .color-picker {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .color-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform 0.15s;
    }
    .color-dot:hover { transform: scale(1.2); }
    .color-dot.selected { border-color: #fff; transform: scale(1.15); }
    .color-dot.yellow { background: #fef08a; }
    .color-dot.blue { background: #bae6fd; }
    .color-dot.pink { background: #fbcfe8; }
    .color-dot.green { background: #bbf7d0; }
    .color-dot.dark { background: #334155; }

    .send-btn {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #0f172a;
      font-weight: 800;
      border: none;
      padding: 9px 16px;
      border-radius: 10px;
      font-size: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .send-btn:hover {
      filter: brightness(1.1);
      box-shadow: 0 0 15px rgba(245, 158, 11, 0.5);
    }
    .send-btn:active {
      transform: scale(0.97);
    }

    /* Footer / Info */
    .widget-footer {
      padding: 8px 18px;
      background: rgba(15, 23, 42, 0.95);
      border-top: 1px solid rgba(255, 255, 255, 0.04);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 10px;
      color: var(--text-sub);
    }

    .footer-link {
      color: #f59e0b;
      text-decoration: none;
      font-weight: 600;
    }
    .footer-link:hover {
      text-decoration: underline;
    }

    /* Minimized state */
    .desktop-widget.minimized .notes-board,
    .desktop-widget.minimized .composer,
    .desktop-widget.minimized .control-deck,
    .desktop-widget.minimized .widget-footer {
      display: none;
    }

    /* Toast Notification */
    .toast-popup {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #f59e0b;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      display: none;
      align-items: center;
      gap: 8px;
      z-index: 9999;
      animation: toastIn 0.2s ease-out;
    }
    @keyframes toastIn {
      from { transform: translateY(15px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- Floating Desktop Note Main Screen -->
  <div class="desktop-widget" id="desktopWidget">
    
    <!-- Titlebar / Header -->
    <div class="titlebar" id="widgetTitlebar">
      <div class="titlebar-left">
        <div class="window-controls">
          <div class="dot dot-red" id="btnClose" title="Close / Hide Note"></div>
          <div class="dot dot-yellow" id="btnMinimize" title="Minimize Window"></div>
          <div class="dot dot-green" id="btnPin" title="Pin Desktop Note (Always on Top)"></div>
        </div>
        <div class="widget-brand">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8Z"/>
            <path d="M15 3v5h5"/>
            <path d="M9 13h6"/>
            <path d="M9 17h4"/>
          </svg>
          <span class="widget-title">Desktop Note</span>
        </div>
      </div>

      <div class="titlebar-actions">
        <!-- Sound Effect Toggle -->
        <button class="icon-btn active" id="btnSound" title="Chime Sound Alert on New Message">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="soundIcon">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
          </svg>
        </button>

        <!-- Node / Path Switcher -->
        <button class="icon-btn" id="btnChangeNode" title="Switch RTDB Node (/messages or /notes)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
          </svg>
        </button>

        <!-- Export Notes -->
        <button class="icon-btn" id="btnExport" title="Export Notes as JSON">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Realtime Connection Status Ribbon -->
    <div class="status-ribbon">
      <div class="status-left">
        <div class="status-pulse" id="statusPulse"></div>
        <span class="status-text" id="statusText">Connecting to Firebase RTDB...</span>
        <span class="database-path-badge" id="pathBadge">/messages</span>
      </div>
      <div class="status-counts" id="noteCountText">
        0 notes
      </div>
    </div>

    <!-- Search & Quick Actions Deck -->
    <div class="control-deck">
      <div class="search-input-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="text" class="search-input" id="searchFilter" placeholder="Filter notes in real-time...">
      </div>
      <button class="action-btn" id="btnSendTest" title="Send a Quick Test Note to RTDB">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        Test Note
      </button>
    </div>

    <!-- Real-time Incoming Notes Board -->
    <div class="notes-board" id="notesBoard">
      <!-- Empty placeholder until messages arrive -->
      <div class="empty-state" id="emptyState">
        <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/>
          <polyline points="10 9 9 9 8 9"/>
        </svg>
        <h3>Waiting for Real-time Notes...</h3>
        <p>Incoming messages from your Firebase Realtime Database will show up here automatically the instant they are published.</p>
      </div>
    </div>

    <!-- Note Composer -->
    <div class="composer">
      <div class="composer-row">
        <input type="text" class="author-input" id="inputAuthor" placeholder="Your Name" value="Yaaro Ka Yaar">
        <div class="color-picker" title="Pick Sticky Note Color">
          <div class="color-dot yellow selected" data-color="yellow"></div>
          <div class="color-dot blue" data-color="blue"></div>
          <div class="color-dot pink" data-color="pink"></div>
          <div class="color-dot green" data-color="green"></div>
          <div class="color-dot dark" data-color="dark"></div>
        </div>
      </div>
      <div class="composer-row">
        <input type="text" class="composer-input" id="inputMessage" placeholder="Type a note or message to broadcast live..." autocomplete="off">
        <button class="send-btn" id="btnSend">
          <span>Post</span>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Window Footer -->
    <div class="widget-footer">
      <div>
        Connected to: <span style="font-family: 'JetBrains Mono', monospace; color: #cbd5e1;">yaarokayaarstream-default-rtdb</span>
      </div>
      <div>
        <a href="javascript:void(0)" class="footer-link" id="btnClearBoard">Clear View</a>
      </div>
    </div>
  </div>

  <!-- Toast Notification element -->
  <div class="toast-popup" id="toast">
    <span id="toastMsg">Action completed</span>
  </div>

  <script>
    // --- 1. FIREBASE REALTIME DATABASE CONFIGURATION ---
    const DB_URL = "https://yaarokayaarstream-default-rtdb.asia-southeast1.firebasedatabase.app/";
    
    const firebaseConfig = {
      apiKey: "AIzaSyAyMC9sP21yM9mwleI_qxiKhQIKukhCKJ4",
      authDomain: "yaarokayaarstream.firebaseapp.com",
      databaseURL: DB_URL,
      projectId: "yaarokayaarstream",
      storageBucket: "yaarokayaarstream.firebasestorage.app",
      messagingSenderId: "478699512400",
      appId: "1:478699512400:web:6e7173dc17a0ef86cf6755"
    };

    // Initialize Firebase Compat App
    let rtdbApp, database, dbRef;
    let currentPath = "text"; // default node path (points to https://yaarokayaarstream-default-rtdb.asia-southeast1.firebasedatabase.app/text)
    let allNotes = [];
    let isSoundOn = true;
    let selectedColor = "yellow";
    let isInitialLoad = true;

    // --- 2. AUDIO SYNTHESIZER (NO EXTERNAL AUDIO FILE NEEDED) ---
    function playChimeSound() {
      if (!isSoundOn) return;
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'sine';
        // Pleasant bell chord (E6 -> G#6)
        osc.frequency.setValueAtTime(1318.51, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1661.22, ctx.currentTime + 0.12);

        gain.gain.setValueAtTime(0.18, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.45);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start();
        osc.stop(ctx.currentTime + 0.45);
      } catch (e) {
        console.warn('Audio playback error:', e);
      }
    }

    // --- 3. TOAST MESSAGES ---
    function showToast(msg) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      toastMsg.textContent = msg;
      toast.style.display = 'flex';
      setTimeout(() => {
        toast.style.display = 'none';
      }, 3000);
    }

    // --- 4. FORMAT TIMESTAMP HELPER ---
    function formatTime(timestamp) {
      if (!timestamp) return 'Just now';
      const date = new Date(timestamp);
      if (isNaN(date.getTime())) return String(timestamp);
      
      const now = new Date();
      const diffSecs = Math.floor((now.getTime() - date.getTime()) / 1000);
      
      if (diffSecs < 10) return 'Just now';
      if (diffSecs < 60) return `${diffSecs}s ago`;
      if (diffSecs < 3600) return `${Math.floor(diffSecs / 60)}m ago`;
      
      return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    // --- 5. INITIALIZE FIREBASE RTDB CONNECTION ---
    function initFirebase() {
      try {
        if (!firebase.apps.length) {
          rtdbApp = firebase.initializeApp(firebaseConfig);
        } else {
          rtdbApp = firebase.app();
        }
        database = firebase.database(rtdbApp);

        // Connection state listener (.info/connected)
        const connectedRef = database.ref(".info/connected");
        connectedRef.on("value", (snap) => {
          const statusPulse = document.getElementById('statusPulse');
          const statusText = document.getElementById('statusText');

          if (snap.val() === true) {
            statusPulse.classList.remove('offline');
            statusText.textContent = "Live Connected to RTDB";
          } else {
            statusPulse.classList.add('offline');
            statusText.textContent = "Connecting to RTDB...";
          }
        });

        attachNodeListener(currentPath);
      } catch (err) {
        console.error("Firebase init failed:", err);
        document.getElementById('statusText').textContent = "Connection Error: " + err.message;
        document.getElementById('statusPulse').classList.add('offline');
      }
    }

    // --- 6. ATTACH REAL-TIME LISTENER TO RTDB NODE ---
    function attachNodeListener(nodePath) {
      if (dbRef) {
        dbRef.off(); // Detach previous listener
      }

      currentPath = nodePath;
      document.getElementById('pathBadge').textContent = `/${nodePath}`;
      dbRef = database.ref(nodePath);

      // Listen for all changes on the path
      dbRef.on('value', (snapshot) => {
        const val = snapshot.val();
        handleDataUpdate(val);
      }, (error) => {
        console.error("Database read error:", error);
        showToast("Read error: " + error.message);
      });
    }

    // Helper to extract specific message text accurately across all schema variations
    function extractMessageText(item) {
      if (item === null || item === undefined) return '';
      if (typeof item === 'string') return item.trim();
      if (typeof item === 'number' || typeof item === 'boolean') return String(item);

      if (typeof item === 'object') {
        if (typeof item.text === 'string' && item.text.trim()) return item.text.trim();
        if (typeof item.message === 'string' && item.message.trim()) return item.message.trim();
        if (typeof item.msg === 'string' && item.msg.trim()) return item.msg.trim();
        if (typeof item.content === 'string' && item.content.trim()) return item.content.trim();
        if (typeof item.body === 'string' && item.body.trim()) return item.body.trim();
        if (typeof item.notification === 'string' && item.notification.trim()) return item.notification.trim();
        if (typeof item.title === 'string' && item.title.trim()) return item.title.trim();
        if (typeof item.note === 'string' && item.note.trim()) return item.note.trim();
        if (typeof item.value === 'string' && item.value.trim()) return item.value.trim();

        if (item.data && typeof item.data === 'object') {
          const nested = extractMessageText(item.data);
          if (nested) return nested;
        }
        if (item.payload && typeof item.payload === 'object') {
          const nested = extractMessageText(item.payload);
          if (nested) return nested;
        }

        for (const [key, val] of Object.entries(item)) {
          if (
            typeof val === 'string' &&
            val.trim() &&
            !['author', 'sender', 'user', 'name', 'timestamp', 'time', 'date', 'createdAt', 'id', 'key', 'color', 'theme'].includes(key)
          ) {
            return val.trim();
          }
        }

        try {
          return JSON.stringify(item);
        } catch (e) {
          return String(item);
        }
      }

      return String(item);
    }

    // --- 7. HANDLE INCOMING REAL-TIME DATA ---
    function handleDataUpdate(data) {
      const notesBoard = document.getElementById('notesBoard');
      const emptyState = document.getElementById('emptyState');
      const noteCountText = document.getElementById('noteCountText');

      allNotes = [];

      if (!data) {
        notesBoard.innerHTML = '';
        notesBoard.appendChild(emptyState);
        emptyState.style.display = 'flex';
        noteCountText.textContent = '0 notes';
        return;
      }

      // Convert data object to array
      if (typeof data === 'object') {
        Object.keys(data).forEach(key => {
          const item = data[key];
          const text = extractMessageText(item);
          if (text) {
            const author = (typeof item === 'object' && item) 
              ? (item.author || item.sender || item.user || item.name || 'Yaaro Ka Yaar')
              : 'Yaaro Ka Yaar';
            const color = (typeof item === 'object' && item && item.color) ? item.color : 'yellow';
            const timestamp = (typeof item === 'object' && item) 
              ? (item.timestamp || item.createdAt || item.time || Date.now())
              : Date.now();

            allNotes.push({
              id: key,
              message: text,
              author: author,
              color: color,
              timestamp: timestamp
            });
          }
        });
      } else {
        const text = extractMessageText(data);
        if (text) {
          allNotes.push({
            id: 'root',
            message: text,
            author: 'Yaaro Ka Yaar',
            color: 'blue',
            timestamp: Date.now()
          });
        }
      }

      // Sort newest first
      allNotes.sort((a, b) => {
        const tA = new Date(a.timestamp).getTime() || 0;
        const tB = new Date(b.timestamp).getTime() || 0;
        return tB - tA;
      });

      renderNotes();

      // Play chime if new incoming note arrives after initial load
      if (!isInitialLoad && allNotes.length > 0) {
        playChimeSound();
      }
      isInitialLoad = false;
    }

    // --- 8. RENDER NOTES TO SCREEN ---
    function renderNotes() {
      const notesBoard = document.getElementById('notesBoard');
      const emptyState = document.getElementById('emptyState');
      const noteCountText = document.getElementById('noteCountText');
      const searchQuery = document.getElementById('searchFilter').value.toLowerCase().trim();

      const filtered = allNotes.filter(n => {
        if (!searchQuery) return true;
        return (n.message && n.message.toLowerCase().includes(searchQuery)) ||
               (n.author && n.author.toLowerCase().includes(searchQuery));
      });

      noteCountText.textContent = `${filtered.length} notes`;

      if (filtered.length === 0) {
        notesBoard.innerHTML = '';
        notesBoard.appendChild(emptyState);
        emptyState.style.display = 'flex';
        return;
      }

      emptyState.style.display = 'none';
      notesBoard.innerHTML = '';

      filtered.forEach(note => {
        const card = document.createElement('div');
        const themeClass = `theme-${note.color || 'yellow'}`;
        card.className = `note-card ${themeClass}`;

        const initial = (note.author && note.author[0]) ? note.author[0].toUpperCase() : 'N';
        const formattedDate = formatTime(note.timestamp);

        card.innerHTML = `
          <div class="note-header">
            <div class="note-author-wrap">
              <div class="author-avatar">${initial}</div>
              <span class="note-author">${escapeHtml(note.author)}</span>
              <span class="note-badge">${escapeHtml(note.color || 'Note')}</span>
            </div>
            <div class="note-meta">
              <span>${formattedDate}</span>
              <div class="note-card-actions">
                <button class="card-tool-btn" title="Copy text" onclick="copyNoteText('${note.id}')">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                  </svg>
                </button>
                <button class="card-tool-btn" title="Delete note" onclick="deleteNote('${note.id}')">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="3 6 5 6 21 6"/>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                  </svg>
                </button>
              </div>
            </div>
          </div>
          <div class="note-body">${linkify(escapeHtml(note.message))}</div>
        `;

        notesBoard.appendChild(card);
      });
    }

    // --- 9. PUBLISH / BROADCAST NEW NOTE TO RTDB ---
    function sendNote() {
      const msgInput = document.getElementById('inputMessage');
      const authorInput = document.getElementById('inputAuthor');
      const message = msgInput.value.trim();
      const author = authorInput.value.trim() || 'Yaaro Ka Yaar';

      if (!message) {
        msgInput.focus();
        return;
      }

      const newNoteRef = database.ref(currentPath).push();
      const notePayload = {
        message: message,
        author: author,
        color: selectedColor,
        timestamp: firebase.database.ServerValue.TIMESTAMP
      };

      newNoteRef.set(notePayload)
        .then(() => {
          msgInput.value = '';
          showToast("Note published live!");
          playChimeSound();
        })
        .catch((err) => {
          console.error("Push failed:", err);
          showToast("Failed: " + err.message);
        });
    }

    // --- 10. DELETE NOTE ---
    window.deleteNote = function(id) {
      if (!confirm("Delete this note from Realtime Database?")) return;
      database.ref(`${currentPath}/${id}`).remove()
        .then(() => showToast("Note deleted"))
        .catch(err => showToast("Error deleting: " + err.message));
    };

    // --- 11. COPY NOTE ---
    window.copyNoteText = function(id) {
      const note = allNotes.find(n => n.id === id);
      if (note && note.message) {
        navigator.clipboard.writeText(note.message)
          .then(() => showToast("Copied note text!"))
          .catch(() => showToast("Copy failed"));
      }
    };

    // --- 12. HELPER UTILS ---
    function escapeHtml(text) {
      if (!text) return '';
      return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function linkify(text) {
      const urlRegex = /(https?:\/\/[^\s]+)/g;
      return text.replace(urlRegex, '<a href="$1" target="_blank" style="color: inherit; text-decoration: underline; font-weight: 600;">$1</a>');
    }

    // --- 13. UI EVENT LISTENERS ---
    document.addEventListener('DOMContentLoaded', () => {
      initFirebase();

      // Send Note Button & Enter Key
      document.getElementById('btnSend').addEventListener('click', sendNote);
      document.getElementById('inputMessage').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          sendNote();
        }
      });

      // Quick Test Note
      document.getElementById('btnSendTest').addEventListener('click', () => {
        const testMessages = [
          "⚡ Live IPTV Stream Check: Server running smoothly at 60 FPS!",
          "🔥 Remember to verify your M3U playlist before the big match tonight.",
          "📌 Link Master encryption alias updated for VIP subscribers.",
          "🎉 Realtime Database connection verified! Everything is updating in real-time."
        ];
        const randomMsg = testMessages[Math.floor(Math.random() * testMessages.length)];
        const colors = ['yellow', 'blue', 'pink', 'green', 'dark'];
        const randomColor = colors[Math.floor(Math.random() * colors.length)];

        database.ref(currentPath).push({
          message: randomMsg,
          author: "Desktop Alert",
          color: randomColor,
          timestamp: firebase.database.ServerValue.TIMESTAMP
        }).then(() => showToast("Test note broadcasted!"));
      });

      // Color picker
      document.querySelectorAll('.color-dot').forEach(dot => {
        dot.addEventListener('click', () => {
          document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('selected'));
          dot.classList.add('selected');
          selectedColor = dot.dataset.color;
        });
      });

      // Search filter
      document.getElementById('searchFilter').addEventListener('input', renderNotes);

      // Sound Toggle
      document.getElementById('btnSound').addEventListener('click', function() {
        isSoundOn = !isSoundOn;
        this.classList.toggle('active', isSoundOn);
        showToast(isSoundOn ? "Sound alert enabled" : "Sound alert muted");
      });

      // Switch Node
      document.getElementById('btnChangeNode').addEventListener('click', () => {
        const newPath = prompt("Enter RTDB node path to listen to (e.g. 'messages', 'notes', 'alerts'):", currentPath);
        if (newPath && newPath.trim()) {
          const sanitized = newPath.trim().replace(/^\/+/, '');
          attachNodeListener(sanitized);
          showToast(`Switched to /${sanitized}`);
        }
      });

      // Export JSON
      document.getElementById('btnExport').addEventListener('click', () => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(allNotes, null, 2));
        const dlAnchor = document.createElement('a');
        dlAnchor.setAttribute("href", dataStr);
        dlAnchor.setAttribute("download", `desktop-notes-${Date.now()}.json`);
        dlAnchor.click();
        showToast("Exported notes JSON!");
      });

      // Clear View
      document.getElementById('btnClearBoard').addEventListener('click', () => {
        allNotes = [];
        renderNotes();
        showToast("Screen cleared");
      });

      // Minimize Window
      document.getElementById('btnMinimize').addEventListener('click', () => {
        document.getElementById('desktopWidget').classList.toggle('minimized');
      });

      // Close Button
      document.getElementById('btnClose').addEventListener('click', () => {
        if (confirm("Close desktop note widget?")) {
          document.getElementById('desktopWidget').style.display = 'none';
        }
      });

      // Pin Window
      let isPinned = false;
      document.getElementById('btnPin').addEventListener('click', () => {
        isPinned = !isPinned;
        showToast(isPinned ? "Pinned: Always visible on desktop" : "Unpinned normal view");
      });
    });
  </script>
</body>
